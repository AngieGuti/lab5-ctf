<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Auditoría de Seguridad - Acceso</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #c9d1d9;
            max-width: 420px;
            margin: 80px auto;
            padding: 0 20px;
        }
        h1 { color: #58a6ff; font-size: 20px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 24px;
        }
        label { display: block; margin-top: 12px; font-size: 13px; color: #8b949e; }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 4px;
            margin-top: 4px;
            box-sizing: border-box;
        }
        button {
            margin-top: 18px;
            width: 100%;
            padding: 10px;
            background: #238636;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #2ea043; }
        .error { color: #f85149; margin-top: 10px; font-size: 13px; }
        .footer { color: #6e7681; font-size: 12px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>
    <h1>🔒 Sistema de Reportes de Auditoría de Seguridad</h1>
    <div class="card">
        <form method="POST" action="/login">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="off">

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password">

            <button type="submit">Iniciar sesión</button>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}
        </form>
    </div>
    <div class="footer">
        Lab5 CTF — Reto 2: IDOR / Broken Access Control
    </div>
</body>
</html>
