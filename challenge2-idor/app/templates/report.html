<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reporte de Auditoría #{{ report['id'] }}</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #c9d1d9;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 { color: #58a6ff; font-size: 20px; }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 13px;
            color: #8b949e;
        }
        .topbar a { color: #58a6ff; text-decoration: none; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
        }
        .meta { color: #6e7681; font-size: 12px; margin-bottom: 14px; }
        pre {
            background: #000;
            padding: 16px;
            border-radius: 6px;
            overflow-x: auto;
            white-space: pre-wrap;
            border: 1px solid #30363d;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <span>Sesión: <strong>{{ username }}</strong></span>
        <a href="/logout">Cerrar sesión</a>
    </div>

    <h1>📄 Reporte de Auditoría #{{ report['id'] }}</h1>
    <div class="card">
        <div class="meta">Propietario (user_id): {{ report['user_id'] }}</div>
        <h3>{{ report['title'] }}</h3>
        <pre>{{ report['content'] }}</pre>
    </div>
</body>
</html>
